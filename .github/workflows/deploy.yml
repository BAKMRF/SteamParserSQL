name: Deploy Steam Parser

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Syntax check
        run: python -m py_compile app.py
          
      - name: Verify imports
        run: |
          python -c "import streamlit, pandas, requests, psycopg2, plotly, dotenv"
          echo "✅ All dependencies OK"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/SteamParserSQL
            
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            
            echo "📦 Updating Python packages..."
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            
            echo "🔄 Restarting Streamlit..."
            systemctl restart steam-parser
            systemctl status steam-parser --no-pager
            
            echo "✅ Deploy completed at $(date)"
