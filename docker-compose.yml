services:
  postgres:
    image: postgres:15
    container_name: steam_parser_db
    environment:
      POSTGRES_DB: steam_parser
      POSTGRES_USER: steam_user
      POSTGRES_PASSWORD: steam_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - steam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam_user -d steam_parser"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-db:
    image: postgres:15
    container_name: airflow_db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - steam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env
    command: >
      bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    networks:
      - steam_network

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: steam-parser-secret-key-change-me
      AIRFLOW__WEBSERVER__WORKERS: "1"
      DB_HOST: steam_parser_db
      DB_PORT: "5432"
      DB_NAME: steam_parser
      DB_USER: steam_user
      DB_PASSWORD: steam_password
      STEAM_API_KEY: 961F0D83B9F176CC709E07BD0EC9355C
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./parser.py:/opt/airflow/parser.py
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./check_db.py:/opt/airflow/check_db.py 
    command: webserver
    networks:
      - steam_network
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      DB_HOST: steam_parser_db
      DB_PORT: "5432"
      DB_NAME: steam_parser
      DB_USER: steam_user
      DB_PASSWORD: steam_password
      STEAM_API_KEY: 961F0D83B9F176CC709E07BD0EC9355C
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./parser.py:/opt/airflow/parser.py
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./check_db.py:/opt/airflow/check_db.py 
    command: scheduler
    networks:
      - steam_network
    restart: unless-stopped

networks:
  steam_network:
    driver: bridge

volumes:
  postgres_data:
  airflow_db_data:
